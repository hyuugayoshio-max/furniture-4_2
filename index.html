<!DOCTYPE html>
<!--
================================================================
 劇用プロップ：架空家具ブランド「hollo INTERIOR」検索画面（実機用）
 ファイル：index.html（GitHub Pages で公開して、スマホのブラウザで開く）
----------------------------------------------------------------
 ■ 基本
  ・スマホの画面いっぱいに表示します（スマホの枠・偽のステータスバーはありません）。
  ・指でスクロールできます。拡大・縮小はできません。
  ・写真はこのファイルに埋め込み済み。外部へのリンク・通信はありません
   （Webフォントだけはネット接続時に読み込み。つながらない場合は
    端末の標準フォントで表示されます）。
  ・開いた直後は、検索欄に「ソファ」と入った検索結果の画面です。
  ・検索欄を押すと入力中の画面になり、候補が出ます。
    キーボードの「検索」で結果が更新されます。
    「×」で入力を消し、「キャンセル」で結果の画面に戻ります。
  ・商品カードを押すと、右から商品ページが開きます。左上の「＜」で戻ります。
  ・カートは空の状態から始まります。「カートに入れる」でバッジ「1」が出ます。

 ■ 撮影用（URLの末尾に付けて開く）
  #q=ワード … そのワードで検索した結果の画面で開く（例：#q=ダイニング）
  #s       … 検索欄が空で、「最近の検索」「人気のキーワード」が出ている画面で開く
  #p0〜#p9 … その番号の商品ページを直接開く（「＜」で「ソファ」の検索結果に戻る）
  （番号：0 NAGI／1 SORA／2 KUMOダイニング／3 AOI／4 HAKO／5 AMI／
          6 KUMOチェア／7 NAGISA／8 MARU／9 NEST）
  ※ アドレスバーで # 以降だけを書き換えたときも、その画面に切り替わります。
  ※ 撮り直しの前に、ページを再読み込みするとカートやハートが元に戻ります。
================================================================
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="format-detection" content="telephone=no">
<title>hollo INTERIOR</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;500;600&display=swap">
<style>
:root{
  --beige:#c9b28c; --beige-d:#a98d62; --green:#98a879; --ink:#2a2724;
  --red:#c4573f; --star:#c9a04a; --sub:#8a837a; --line:#ebe6df; --pale:#f6f2ec;
  --serif-en:"Cormorant Garamond","Times New Roman",serif;
  --sans:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --serif-jp:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#fff;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:#fff;font-family:var(--sans);color:var(--ink);min-height:100vh;touch-action:manipulation;padding-bottom:calc(24px + var(--sb));-webkit-user-select:none;user-select:none;overflow-x:hidden}
html.lock,html.lock body{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}
#defs{position:absolute;width:0;height:0;overflow:hidden}

/* ---------- ヘッダー・検索バー ---------- */
.top{position:sticky;top:0;z-index:20;background:#fff;padding-top:var(--st);border-bottom:1px solid var(--line)}
.nav{position:relative;height:50px;display:flex;align-items:center;padding:0 8px}
.nav .logo{position:absolute;left:50%;transform:translateX(-50%);font-family:var(--serif-en);font-weight:500;font-size:28px;line-height:1;letter-spacing:.02em;white-space:nowrap}
.nav .logo small{font-size:9.5px;letter-spacing:.38em;margin-left:5px;vertical-align:middle;font-weight:500}
.ic{width:40px;height:40px;display:flex;align-items:center;justify-content:center;position:relative}
.ic:active{opacity:.5}
.nav .rt{margin-left:auto;display:flex}
.badge{position:absolute;right:2px;top:3px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;font-family:var(--sans)}
.badge.zero{display:none}
.badge.pop{animation:pop .4s}
@keyframes pop{40%{transform:scale(1.5)}}

.sbar{display:flex;align-items:center;gap:10px;padding:2px 16px 12px}
.sbox{flex:1;height:42px;border-radius:21px;background:var(--pale);display:flex;align-items:center;padding:0 6px 0 14px;gap:8px;min-width:0}
.sbox input{flex:1;min-width:0;height:100%;border:0;background:none;outline:none;font-family:var(--sans);font-size:16px;color:var(--ink);-webkit-appearance:none;appearance:none;border-radius:0;-webkit-user-select:text;user-select:text}
.sbox input::placeholder{color:#a49c92}
.sbox input::-webkit-search-cancel-button,.sbox input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.clr{width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex:none}
.clr i{width:18px;height:18px;border-radius:50%;background:#bdb5aa;display:flex;align-items:center;justify-content:center}
.clr.hide{visibility:hidden}
.cancel{font-size:14px;color:var(--beige-d);font-weight:500;white-space:nowrap;padding:8px 0}
.cancel:active{opacity:.5}

/* ---------- 入力中パネル ---------- */
#panel{padding:6px 0 30px}
.sug{list-style:none}
.sug li{display:flex;align-items:center;gap:12px;padding:0 16px;height:50px;border-bottom:1px solid var(--line);font-size:15px;cursor:pointer}
.sug li:active{background:var(--pale)}
.sug li b{font-weight:700;color:var(--ink)}
.sug li span{flex:1;color:#5d5750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug li em{font-style:normal;font-size:10.5px;color:var(--sub);border:1px solid var(--line);border-radius:10px;padding:1px 8px;flex:none}
.grp{padding:16px 16px 6px}
.grp h4{font-size:12.5px;font-weight:700;margin-bottom:12px;display:flex;align-items:center}
.grp h4 small{margin-left:auto;font-weight:400;font-size:11.5px;color:var(--sub)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{border:1px solid #d8d1c7;border-radius:18px;padding:7px 14px;font-size:13px;display:inline-flex;align-items:center;gap:6px;background:#fff}
.tag:active{background:var(--pale)}
.tag.hot{border-color:var(--beige)}
.tag .n{font-family:var(--serif-en);font-size:14px;color:var(--beige-d);font-weight:600}

/* ---------- 検索結果 ---------- */
.rhead{padding:16px 16px 0;font-size:13px}
.rhead b.q{font-weight:700}
.rhead .cnt{font-size:18px;font-weight:700;margin:0 1px 0 6px}
.toolbar{display:flex;align-items:center;justify-content:flex-end;padding:10px 16px 0;gap:8px}
.toolbar button{border:1px solid #d8d1c7;border-radius:15px;padding:5px 13px;font-size:12px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;font-size:13px;padding:7px 16px;border-radius:18px;border:1px solid var(--line);background:#fff;color:#5d5750}
.tabs button.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:500}
.empty{padding:40px 24px 10px;text-align:center}
.empty svg{margin:0 auto 14px}
.empty p{font-size:14px;line-height:1.7;font-weight:500}
.empty small{display:block;font-size:12px;color:var(--sub);margin-top:6px}

.ph{position:relative;overflow:hidden;background:#e4e1dc}
.ph img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px 12px;padding:0 16px}
.card{cursor:pointer}
.card:active{opacity:.75}
.card .ph{aspect-ratio:1/1;border-radius:3px}
.lbl{position:absolute;left:0;top:0;background:var(--red);color:#fff;font-size:9.5px;font-weight:700;padding:3px 7px;letter-spacing:.04em}
.lbl.new{background:var(--green);left:auto;right:0}
.card .code{font-family:var(--serif-en);font-size:13px;letter-spacing:.1em;margin-top:7px;color:#6a635a;display:flex;align-items:center;gap:6px}
.sw{display:inline-flex;gap:3px;margin-left:auto}
.sw i{width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
.card .kana{font-size:12px;font-weight:700;margin-top:2px}
.card .nm{font-size:10px;color:var(--sub);line-height:1.45;margin-top:2px;height:29px;overflow:hidden}
.price{font-size:15px;font-weight:700;margin-top:4px}
.price small{font-size:9.5px;font-weight:400;color:var(--sub);margin-left:2px}
.price s{font-size:11px;color:var(--sub);font-weight:400;margin-right:5px}
.price.sale b{color:var(--red)}
.stars{display:flex;align-items:center;gap:1px;font-size:10.5px;color:var(--sub);margin-top:2px}
.stars em{font-style:normal;margin-left:4px}
.ship{font-size:10px;color:var(--beige-d);margin-top:3px;font-weight:500}
.ship.fair2{color:var(--red)}
.endnote{text-align:center;font-size:11px;color:var(--sub);padding:30px 0 10px}

/* ---------- 商品ページ ---------- */
#detail{position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;z-index:50;transform:translateX(100%);visibility:hidden;transition:transform .32s cubic-bezier(.3,.7,.3,1),visibility 0s linear .32s}
#detail.open{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.3,.7,.3,1),visibility 0s}
#detail.noanim{transition:none!important}
#dscroll{position:absolute;top:0;left:0;right:0;bottom:calc(66px + var(--sb));overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.dtop{position:sticky;top:0;z-index:5;background:#fff;padding-top:var(--st);border-bottom:1px solid var(--line)}
.dtop .nav .logo{font-size:24px}
.crumb{font-size:10px;color:var(--sub);padding:10px 16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gal .ph{aspect-ratio:1/1;width:100%}
.gal .cnt{position:absolute;right:12px;bottom:12px;background:rgba(42,39,36,.6);color:#fff;font-size:11px;padding:3px 10px;border-radius:11px;font-family:var(--serif-en);letter-spacing:.08em}
.thumbs{display:flex;gap:8px;padding:10px 16px}
.thumbs .ph{width:62px;height:62px;border-radius:3px;cursor:pointer;opacity:.55;outline:2px solid transparent;outline-offset:-2px}
.thumbs .ph.on{opacity:1;outline-color:var(--ink)}
.dinfo{padding:6px 16px 0}
.dinfo .code{font-family:var(--serif-en);font-size:14px;letter-spacing:.14em;color:#6a635a}
.dinfo h1{font-size:17px;font-weight:700;line-height:1.5;margin-top:4px}
.dinfo .stars{font-size:12px;margin-top:6px}
.dinfo .stars u{margin-left:8px;color:var(--beige-d)}
.dprice{margin-top:12px;font-size:26px;font-weight:700}
.dprice small{font-size:11px;font-weight:400;color:var(--sub);margin-left:4px}
.dprice s{display:block;font-size:13px;font-weight:400;color:var(--sub)}
.dprice.sale b{color:var(--red)}
.dprice .off{display:inline-block;background:var(--red);color:#fff;font-size:11px;padding:2px 6px;margin-left:8px;vertical-align:middle;border-radius:2px}
.pt{font-size:11.5px;color:var(--beige-d);margin-top:4px}
.opt{border-top:1px solid var(--line);margin:16px 16px 0;padding-top:14px}
.opt h4{font-size:12.5px;font-weight:500;margin-bottom:10px}
.opt h4 span{font-weight:700}
.csel{display:flex;gap:12px}
.csel button{width:40px;height:40px;border-radius:50%;padding:3px;border:1.5px solid transparent}
.csel button.on{border-color:var(--ink)}
.csel button i{display:block;width:100%;height:100%;border-radius:50%;border:1px solid rgba(0,0,0,.1)}
.qty{display:inline-flex;border:1px solid #d8d1c7;border-radius:3px;height:40px;align-items:center}
.qty button{width:44px;height:100%;font-size:18px;color:#6a635a}
.qty span{width:44px;text-align:center;font-size:14px;border-left:1px solid #d8d1c7;border-right:1px solid #d8d1c7;line-height:38px}
.dlv{margin:16px 16px 0;background:var(--pale);border-radius:4px;padding:12px 14px;font-size:11.5px;line-height:1.6}
.dlv div{display:flex;gap:10px;padding:5px 0}
.dlv div+div{border-top:1px dashed #e0d7ca}
.dlv b{flex:none;width:62px;font-weight:700}
.blk{margin:26px 16px 0}
.blk h3{font-family:var(--serif-en);font-size:22px;font-weight:500;border-bottom:1px solid var(--ink);padding-bottom:6px;margin-bottom:12px;display:flex;align-items:baseline;gap:8px}
.blk h3 span{font-family:var(--serif-jp);font-size:11.5px;color:#5d5750;letter-spacing:.08em}
.blk p.desc{font-size:12.5px;line-height:1.9}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th,td{border-bottom:1px solid var(--line);padding:9px 6px;text-align:left;vertical-align:top;line-height:1.5}
th{width:84px;background:var(--pale);font-weight:500}
.rv{display:flex;gap:16px;align-items:center}
.rv .big{text-align:center}
.rv .big b{font-size:34px;font-family:var(--serif-en);font-weight:500;line-height:1}
.rv .big small{display:block;font-size:10px;color:var(--sub)}
.bars{flex:1}
.bars div{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--sub);line-height:1.9}
.bars i{flex:1;height:6px;background:#efebe5;border-radius:3px;overflow:hidden}
.bars i u{display:block;height:100%;background:var(--star)}
.rev{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.rev .hd{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--sub)}
.rev .hd span{margin-left:auto}
.rev b{display:block;font-size:12.5px;margin:6px 0 4px}
.rev p{font-size:11.5px;line-height:1.75;color:#4a453f}
.revmore{display:block;margin-top:14px;font-size:12px;text-align:center;border:1px solid #d8d1c7;padding:10px;width:100%}
.hs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px;-webkit-overflow-scrolling:touch}
.hs::-webkit-scrollbar{display:none}
.rel{flex:none;width:118px;cursor:pointer}
.rel .ph{aspect-ratio:1/1;border-radius:3px}
.rel p{font-size:10.5px;font-weight:700;margin-top:5px}
.rel .price{font-size:12px}
.dpad{height:30px}
.buybar{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;gap:10px;padding:10px 16px calc(10px + var(--sb));z-index:6}
.fav{width:48px;height:46px;flex:none;border:1px solid #d8d1c7;border-radius:3px;display:flex;align-items:center;justify-content:center}
.fav.on svg path{fill:var(--red);stroke:var(--red)}
.fav.on{animation:pop .35s}
.addcart{flex:1;height:46px;background:var(--ink);color:#fff;border-radius:3px;font-size:14px;font-weight:700;letter-spacing:.08em;display:flex;align-items:center;justify-content:center;transition:background .2s}
.addcart.done{background:var(--beige-d)}
#toast{position:fixed;left:50%;bottom:calc(90px + var(--sb));transform:translate(-50%,12px);background:rgba(42,39,36,.92);color:#fff;font-size:12.5px;padding:11px 20px;border-radius:22px;z-index:70;opacity:0;transition:.25s;white-space:nowrap;display:flex;gap:8px;align-items:center;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<svg id="defs" aria-hidden="true"><defs id="gdefs"></defs></svg>

<header class="top">
  <div class="nav">
    <button class="ic" id="hback" aria-label="戻る"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2a2724" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button>
    <div class="logo">hollo<small>INTERIOR</small></div>
    <div class="rt"><span class="ic" aria-label="カート"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2a2724" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.2l2.3 11h10.6l2-8H6.3"/><circle cx="9" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg><span class="badge cartn zero"></span></span></div>
  </div>
  <form class="sbar" id="sform" action="#" autocomplete="off">
    <label class="sbox">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6a635a" stroke-width="1.7" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
      <input id="q" type="search" inputmode="search" enterkeyhint="search" placeholder="商品・キーワードで検索" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button type="button" class="clr" id="clr" aria-label="入力を消す"><i><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg></i></button>
    </label>
    <button type="button" class="cancel" id="cancel">キャンセル</button>
  </form>
</header>

<main>
  <section id="panel" hidden></section>
  <section id="results" hidden>
    <div class="rhead" id="rhead"></div>
    <div class="toolbar"><button type="button">絞り込み ▾</button><button type="button">人気順 ▾</button></div>
    <div class="tabs" id="tabs"></div>
    <div id="rbody"></div>
  </section>
</main>

<div id="detail" aria-hidden="true">
  <div id="dscroll"></div>
  <div class="buybar">
    <button class="fav" id="fav" aria-label="お気に入り"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 20.3s-7.8-4.6-7.8-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.8 2.5c0 5.6-7.8 10.2-7.8 10.2z" fill="none" stroke="#2a2724" stroke-width="1.5" stroke-linejoin="round"/></svg></button>
    <button class="addcart" id="addcart">カートに入れる</button>
  </div>
</div>
<div id="toast"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>カートに追加しました</div>

<script>
/* ===== 最初に入っている検索ワード ===== */
const DEFAULT_QUERY = 'ソファ';
const RECENT  = ['ソファ','ダイニングセット','ラタン'];
const POPULAR = ['年末セール','カウチソファ','ペーパーコード','ガラステーブル','ニットクッション'];

/* ===== 検索 ===== */
// ひらがな→カタカナ、全角半角・大文字小文字・空白・長音をそろえる
function norm(s){
  return String(s).normalize('NFKC').toLowerCase()
    .replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60))
    .replace(/[\s　・／\/|｜]/g, '').replace(/[ー-]/g, '');
}
P.forEach(p => { p.hay = norm(p.name + p.kana + p.cat + (p.sale ? '年末セール' : '')); });
function hit(p, w){
  if (p.hay.includes(w)) return true;
  // 「ガラステーブル」「ダイニングセット」のような複合語は2つに分けて判定
  for (let i = 2; i <= w.length - 2; i++) if (p.hay.includes(w.slice(0,i)) && p.hay.includes(w.slice(i))) return true;
  return false;
}
function search(q){
  const words = String(q).normalize('NFKC').split(/[\s　]+/).map(norm).filter(Boolean);
  if (!words.length) return [];
  return P.filter(p => words.every(w => hit(p, w)));
}

const CANDS = [...new Set([
  'ソファ','ソファ 3人掛け','ソファ 2人掛け','カウチソファ','レザー調ソファ',
  'テーブル','センターテーブル','ガラステーブル','ローテーブル','ネストテーブル',
  'チェア','アームチェア','ペーパーコード','ダイニング','ダイニングセット','ダイニング 5点セット',
  'ラタン','ウォールバスケット','プランターカバー','クッション','ニットクッション','インテリア雑貨','グリーン雑貨',
  ...P.map(p => p.kana)
])];
function suggest(q){
  const n = norm(q); if (!n) return [];
  const a = [], b = [];
  CANDS.forEach(c => { const m = norm(c); if (m.startsWith(n)) a.push(c); else if (m.includes(n)) b.push(c); });
  return a.concat(b).slice(0, 5);
}
function hl(c, q){ // 入力した部分を太字に
  const t = String(q).trim(); const i = t ? c.indexOf(t) : -1;
  return i < 0 ? esc(c) : esc(c.slice(0,i)) + '<b>' + esc(t) + '</b>' + esc(c.slice(i + t.length));
}

    <div class="dprice ${p.sale?'sale':''}">${p.sale?`<s>通常価格 ${yen(p.price)}</s>`:''}<b>${yen(pr)}</b><small>（税込）</small>${off?`<span class="off">${off}%OFF</span>`:''}</div>
    <div class="pt">${Math.floor(pr/100).toLocaleString()}ポイント（1%）還元</div>
  </div>
  <div class="opt"><h4>カラー：<span id="cname">${p.colors[0][0]}</span></h4>
    <div class="csel">${p.colors.map((c,n)=>`<button class="${n?'':'on'}" data-c="${n}"><i style="background:${c[1]}"></i></button>`).join('')}</div></div>
  <div class="opt"><h4>数量</h4><div class="qty"><button data-q="-1">−</button><span id="qn">1</span><button data-q="1">＋</button></div></div>
  <div class="dlv">
    <div><b>お届け</b><span>${when}</span></div>
    <div><b>送料</b><span>${shipFee}</span></div>
    <div><b>組立</b><span>${p.asm}</span></div>
  </div>
  <div class="blk"><h3>Description<span>商品説明</span></h3><p class="desc">${p.desc}</p></div>
  <div class="blk"><h3>Spec<span>サイズ・仕様</span></h3><table>
    <tr><th>サイズ</th><td>${p.size}</td></tr>
    <tr><th>素材</th><td>${p.mat}</td></tr>
    <tr><th>カラー</th><td>${p.colors.map(c=>c[0]).join('／')}</td></tr>
    <tr><th>品番</th><td>${p.hin}</td></tr>
    <tr><th>保証</th><td>1年保証</td></tr>
  </table></div>
  <div class="blk"><h3>Review<span>レビュー</span></h3>
    <div class="rv"><div class="big"><b>${p.rating.toFixed(1)}</b><div class="stars" style="justify-content:center">${stars(p.rating)}</div><small>${p.rv}件のレビュー</small></div>
    <div class="bars">${d.map((v,n)=>`<div>${5-n}<i><u style="width:${v}%"></u></i>${v}%</div>`).join('')}</div></div>
    ${p.revs.map(r=>`<div class="rev"><div class="hd"><div class="stars">${stars(+r[0].slice(1))}</div>${r[1]}<span>購入者</span></div><b>${r[2]}</b><p>${r[3]}</p></div>`).join('')}
    <button class="revmore">レビューをすべて見る（${p.rv}件）</button>
  </div>
  <div class="blk"><h3>Together<span>一緒に選ばれているアイテム</span></h3>
    <div class="hs">${rel.map(q=>`<div class="rel" data-p="${q.id}">${ph(q.img[0])}<p>${q.kana}</p>${priceHTML(q,'price')}</div>`).join('')}</div>
  </div>
  <div class="dpad"></div>`;
  DS.scrollTop = 0;
  $('fav').classList.remove('on');
  const ac = $('addcart'); ac.classList.remove('done'); ac.textContent='カートに入れる';
  input.blur();
  document.documentElement.classList.add('lock');
  D.setAttribute('aria-hidden','false');
  if (instant){ D.classList.add('noanim','open'); void D.offsetWidth; D.classList.remove('noanim'); }
  else D.classList.add('open');
}
function closeP(instant){
  document.documentElement.classList.remove('lock');
  D.setAttribute('aria-hidden','true');
  if (instant){ D.classList.add('noanim'); D.classList.remove('open'); void D.offsetWidth; D.classList.remove('noanim'); }
  else D.classList.remove('open');
}

/* ===== タップ ===== */
document.addEventListener('click', e => {
  const t = e.target;
  const w = t.closest('[data-w]'); if (w){ commit(w.dataset.w); return; }
  const tb = t.closest('[data-tab]'); if (tb){ tab = tb.dataset.tab; renderResults(); return; }
  const pEl = t.closest('[data-p]'); if (pEl){ openP(+pEl.dataset.p); return; }
  if (t.closest('#back')){ closeP(); return; }
  const th = t.closest('[data-t]');
  if (th){ const n=+th.dataset.t; const p=P[cur];
    $('gal').innerHTML = ph(p.img[n],'',`<span class="cnt">${n+1} / 3</span>`);
    document.querySelectorAll('.thumbs .ph').forEach((x,k)=>x.classList.toggle('on',k===n)); return; }
  const cb = t.closest('[data-c]');
  if (cb){ document.querySelectorAll('.csel button').forEach(b=>b.classList.toggle('on',b===cb));
    $('cname').textContent = P[cur].colors[+cb.dataset.c][0]; return; }
  const q = t.closest('[data-q]');
  if (q){ const el=$('qn'); el.textContent=Math.max(1,Math.min(9,+el.textContent + +q.dataset.q)); return; }
  if (t.closest('#fav')){ $('fav').classList.toggle('on'); return; }
  if (t.closest('#addcart')){ const ac=$('addcart'); if (ac.classList.contains('done')) return;
    ac.classList.add('done'); ac.textContent='カートに追加済み ✓'; cart++; setCart();
    const ts=$('toast'); ts.classList.add('on'); clearTimeout(ts._t); ts._t=setTimeout(()=>ts.classList.remove('on'),1800); return; }
});

/* iPhoneのピンチ・ダブルタップでの拡大を止める */
['gesturestart','gesturechange'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), {passive:false}));

/* ===== URLのハッシュ ===== */
function applyHash(){
  let h = location.hash.slice(1);
  try { h = decodeURIComponent(h); } catch(e){}
  closeP(true);
  const m = h.match(/^p(\d)$/);
  if (h === 's'){ input.value=''; committed=''; editing=false; tab='すべて'; render(); window.scrollTo(0,0); }
  else if (h.startsWith('q=')) commit(h.slice(2));
  else if (m){ commit(DEFAULT_QUERY); openP(+m[1], true); }
  else commit(DEFAULT_QUERY);
}
addEventListener('hashchange', applyHash);
applyHash();
</script>
